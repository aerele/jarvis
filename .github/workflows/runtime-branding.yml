name: Runtime branding

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test generic scanner
        run: python -m unittest jarvis.tests.test_branding_scanner
      - name: Enforce Admin-owned policy on this commit
        env:
          # Immutable policy version: publish a new variable for each policy change.
          # No private repository credentials or policy contents ship in the app.
          JARVIS_BRANDING_POLICY: ${{ vars.JARVIS_BRANDING_POLICY_0357C6F39BD98ABF }}
        run: >-
          python -m jarvis.ci.runtime_branding
          --policy-env JARVIS_BRANDING_POLICY
          --expected-policy-sha256 0357c6f39bd98abf791a41adb859c01ad0c2caae5bed3a03f5bea2cd0c32aaba
