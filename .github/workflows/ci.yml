name: CI

# version-15 branch CI. This branch supports customers on Frappe v15, so the bench-backed
# test job here builds a *Frappe version-15* environment from scratch (frappe + erpnext +
# hrms at version-15 HEAD) and runs the jarvis suite against it. Fixes are born on
# `develop` and cherry-picked here; this workflow is what proves a cherry-pick actually
# works on v15 instead of merely applying cleanly.
#
# Deliberate differences from develop's ci.yml:
#
#   - No pre-baked ghcr.io/aerele/jarvis-ci-base image: that image is version-16 and its
#     nightly rebuild schedule only fires from the default branch. PR volume here is low
#     (cherry-picks), so the ~6 min from-scratch bench build is paid per run instead of
#     maintaining a second image. If cherry-pick volume ever makes that painful, add a
#     :v15 tag to ci-base-image.yml on the default branch (Dockerfile.ci-base already
#     takes FRAPPE_BRANCH / PYTHON_VERSION / NODE_MAJOR build-args) and mirror develop's
#     container job here.
#
#   - One unsharded test run instead of 4 shards + a coverage-combine job: sharding only
#     pays when per-shard setup is a cheap image pull. From scratch, 4 shards would build
#     the bench 4 times. Coverage is reported inline (see the test step) with no enforced
#     floor yet — turn a floor on once the suite is green on v15.
#
# The lint / frontend jobs are byte-identical to develop's: they never touch a bench, so
# nothing about them is Frappe-version-specific. Keep them in lockstep when cherry-picking
# CI changes.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [version-15]

concurrency:
  group: ci-${{ github.ref }}
  # Never auto-cancel a version-15 run (cancelled reads as neutral, not failed → hides
  # regressions on the release branch).
  cancel-in-progress: ${{ github.ref != 'refs/heads/version-15' }}

permissions:
  contents: read

jobs:
  # Runs the same .pre-commit-config.yaml the local hook runs, so the checks hold
  # even for a clone where nobody ran `pre-commit install`. Deliberately NOT in
  # the tests environment: this needs only python + node, and it should report in
  # under a minute rather than waiting on a bench.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pre-commit/action@v3.0.1
        env:
          # no-commit-to-branch is a LOCAL guard: it inspects the checked-out
          # branch name. On `push: branches: [version-15]` the checkout IS
          # version-15, so leaving it on would fail this job on every merge. It
          # has no meaning server-side anyway - the PR requirement is what
          # enforces it.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files --show-diff-on-failure

  # The frontend Vue SPA carries its own two test suites; this job is their gate. It needs
  # only node — no bench, no container — so it reports fast and independently of the
  # Python job below. The SPA is served identically on v15 and v16 sites, so this job is
  # identical to develop's.
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full-repo checkout, not a sparse frontend/ one: frontend/package.json depends on
      # ../wiki-graph-core via a `file:` link, so its sibling must be on disk for `npm ci`.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 is this repo's canonical dev/bench version and what the suite is validated
          # against locally. (The lint job runs 20 because it only shells pre-commit hooks.)
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Vitest (*.spec.js + tests/support-extraction/**/*.test.js)
        working-directory: frontend
        env:
          # Belt-and-braces: vitest already fails a non-watch run on an unhandled rejection, but
          # make node itself throw on one too so nothing rejects silently.
          NODE_OPTIONS: --unhandled-rejections=strict
        run: |
          # `npm test` is `vitest run` (non-watch). Exactly one file is quarantined:
          #
          #   tests/support-extraction/support-thread.test.js
          #
          # It has a single PRE-EXISTING, unrelated failure (a mid-flight ticket-switch reply is
          # asserted against a two-arg uploadTo() signature that has since grown extra args).
          # Excluding the one file lets the other files gate PRs today. DELETE this
          # --exclude — re-including the file — the moment that assertion is repaired upstream.
          npm test -- --exclude '**/support-thread.test.js'

      - name: node:test (co-located src/**/*.test.js)
        working-directory: frontend
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
        # node's runner exits non-zero on any failure or unhandled rejection; no watch mode exists
        # for `node --test`, so this is inherently a one-shot gate.
        run: npm run test:node

      - name: node:test (Desk widget + PWA lib)
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
        # These two suites are plain node:test with only sibling-module imports (no npm deps),
        # so they run from the repo root with bare node - no `npm ci` needed.
        run: |
          node --test jarvis/public/js/jarvis_chat/widget/*.test.mjs
          node --test pwa/src/lib/*.test.js

  # Builds the SPA (the /jarvis artifact) the way the Frappe Cloud deploy does, so a
  # Vite/build break surfaces here instead of as a 404 on /jarvis after deploy. (The PWA
  # build resolves the bench site config via a bench-relative path a bare runner lacks, so
  # it is not gated here — same follow-up as on develop.)
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Stub the bench site config the SPA build reads (no bench in CI)
        # src/socket.js imports sites/common_site_config.json at build time (for the socketio
        # port); a bare runner has no bench, so provide a minimal stub. Frappe Cloud builds
        # INSIDE a real bench where this file already exists — this only reproduces that for CI.
        run: |
          mkdir -p "$HOME/sites"
          printf '%s' '{"socketio_port": 9000, "developer_mode": 0}' > "$HOME/sites/common_site_config.json"
      - name: Build the SPA (Vite) — the /jarvis deploy artifact
        run: npm run install-frontend && npm run build-frontend

  # The v15 gate: from-scratch Frappe version-15 bench + the full jarvis suite.
  #
  # jarvis's tier-2 tools tests do mock.patch("erpnext...") and mock.patch("hrms..."), which
  # IMPORT those modules — so both erpnext AND hrms (version-15) must be installed, or those
  # tests error.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          # Passwordless mysql@localhost user so `healthcheck.sh --su-mysql --connect` works.
          MARIADB_MYSQL_LOCALHOST_USER: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20 --health-start-period=40s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Clone jarvis
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          # frappe version-15 pins requires-python ">=3.10,<3.15"; 3.11 is the version
          # v15 has run on in production the longest, so it is the least surprising pick.
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          # frappe version-15 needs node >= 18. 20 is what Frappe Cloud v15 benches are
          # moved to for jarvis (@google/gemini-cli at the repo root needs >= 20), so CI
          # mirrors the deploy target rather than the bare minimum.
          node-version: "20"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          sudo npm install -g yarn
          pip install "frappe-bench>=5.29,<6"

      - name: Init bench (frappe version-15)
        run: |
          bench init --skip-redis-config-generation \
            --frappe-branch version-15 \
            --python "$(which python)" \
            frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          # Distinct Redis DB indices per role — Frappe assumes cache/queue/socketio do
          # not share a keyspace.
          bench set-config -g redis_cache "redis://127.0.0.1:6379/0"
          bench set-config -g redis_queue "redis://127.0.0.1:6379/1"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379/2"

      - name: Get apps (erpnext + hrms at version-15)
        working-directory: frappe-bench
        run: |
          # --skip-assets: backend tests never use the JS bundles; skip erpnext/hrms builds.
          # Serial on purpose: both get-apps write the shared venv and sites/apps.txt.
          bench get-app --branch version-15 --skip-assets erpnext
          bench get-app --branch version-15 --skip-assets hrms

      - name: Add jarvis to the bench
        working-directory: frappe-bench
        run: |
          # Deliberately NOT `bench get-app`: that runs `yarn install --check-files`
          # whenever an app has a package.json (bench/app.py), which here pulls
          # @google/gemini-cli and, via postinstall, both Vue frontends' deps — npm work
          # the Python suite never reads. Same reasoning as develop's ci.yml.
          cp -r "${GITHUB_WORKSPACE}/app" apps/jarvis
          ./env/bin/pip install -e apps/jarvis
          if ! grep -qxF jarvis sites/apps.txt; then
            # Guard against a no-trailing-newline apps.txt: a naive append would fuse the
            # last app name with "jarvis" and frappe dies on the merged module name.
            [ -z "$(tail -c1 sites/apps.txt)" ] || echo >> sites/apps.txt
            echo jarvis >> sites/apps.txt
          fi

      - name: Record what this run actually tested against
        working-directory: frappe-bench
        run: |
          # version-15 upstream moves under us; without this a green check is unauditable
          # after the fact. Read the SHAs from the clones that were actually installed —
          # an ls-remote taken earlier could drift from what a later clone fetched.
          {
            echo "### Upstream revisions (as cloned)"
            echo
            for app in frappe erpnext hrms; do
              echo "- ${app}: \`$(git -C "apps/${app}" rev-parse HEAD)\`"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Create test site + install apps
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --db-host 127.0.0.1 \
            --mariadb-user-host-login-scope='%' \
            --mariadb-root-password root \
            --db-root-username root \
            --admin-password admin
          bench --site test_site install-app erpnext hrms jarvis
          bench --site test_site set-config allow_tests true
          # Full suite creates far more than Frappe's default 60-users/60-min limit
          # (throttle_user_creation); raise it so no mid-suite fixture insert hits
          # "Throttled". -p stores an INT (a string limit breaks the count>limit compare).
          bench --site test_site set-config -p throttle_user_limit 100000

      - name: Assert the site is what we think it is
        working-directory: frappe-bench
        run: |
          # Fail fast with a clear "missing app" instead of letting a partial install
          # surface later as confusing tier-2 mock.patch("erpnext...") import errors.
          #
          # Take the JSON line specifically and leave stderr on the console: merging
          # stderr and taking `tail -1` would capture any late warning instead of the
          # JSON, failing a perfectly healthy site.
          apps=$(bench --site test_site execute frappe.get_installed_apps | grep -m1 '^\[') || {
            echo "could not parse installed apps from 'bench execute' output"; exit 1; }
          echo "installed apps: ${apps}"
          for a in frappe erpnext hrms jarvis; do
            echo "${apps}" | grep -q "\"${a}\"" || { echo "missing app: ${a}"; exit 1; }
          done

      - name: Run tests + coverage
        working-directory: frappe-bench
        run: |
          # gevent: needed by jarvis/realtime/handlers.py (socketio_backend=python) and its
          # tests.
          ./env/bin/pip install coverage gevent
          bench --site test_site run-tests --app jarvis --coverage
          # Report-only for now: the point of this job today is the v15 failure list, and
          # an enforced floor on a red suite adds a second failure that explains nothing.
          # Once the suite is green on v15, promote this to --fail-under like develop.
          ./env/bin/coverage report --data-file=sites/.coverage || true
