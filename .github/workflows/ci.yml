name: CI

# version-15 branch CI. This branch supports customers on Frappe v15, so the bench-backed
# test job here builds a *Frappe version-15* environment from scratch (frappe + erpnext +
# hrms at version-15 HEAD) and runs the jarvis suite against it. Fixes are born on
# `develop` and cherry-picked here; this workflow is what proves a cherry-pick actually
# works on v15 instead of merely applying cleanly.
#
# Deliberate differences from develop's ci.yml:
#
#   - No pre-baked ghcr.io/aerele/jarvis-ci-base image: that image is version-16 and its
#     nightly rebuild schedule only fires from the default branch. PR volume here is low
#     (cherry-picks), so the ~6 min from-scratch bench build is paid per run instead of
#     maintaining a second image. If cherry-pick volume ever makes that painful, add a
#     :v15 tag to ci-base-image.yml on the default branch (Dockerfile.ci-base already
#     takes FRAPPE_BRANCH / PYTHON_VERSION / NODE_MAJOR build-args) and mirror develop's
#     container job here.
#
#   - Sharded 4 ways (matrix below), like develop, but WITHOUT a prebaked image: every
#     shard rebuilds the ~6 min bench from scratch, so this trades 4x build-minutes for a
#     roughly halved wall-clock. That trade is only worth taking because jarvis is a PUBLIC
#     repo where Actions minutes are free; on a billed repo the from-scratch rebuild x4
#     would be the wrong call. The real fix (fast AND cheap) is a prebaked :v15 image per
#     the note above — add it and each shard's setup becomes a cheap pull like develop's.
#     Each shard uploads its coverage data; the `coverage` job at the bottom combines all
#     four and enforces the floor once (mirroring develop). A per-shard floor is impossible
#     because each shard only covers about a quarter of the code.
#
# The lint / frontend jobs are byte-identical to develop's: they never touch a bench, so
# nothing about them is Frappe-version-specific. Keep them in lockstep when cherry-picking
# CI changes.

on:
  workflow_dispatch:
  # Default PR types only, deliberately without `edited` (the event a base retarget sends).
  # Listening to it and skipping the jobs on title edits was tried and is a trap: a skipped
  # job still posts a "skipped" check run, GitHub reads the LATEST check per name, and a
  # skipped check satisfies a required check, so a title edit after a red run would mask
  # the failure. release-guard.yml instead fails a PR whose base changed until it is pushed
  # to or reopened, which is what makes this workflow run against the new base.
  pull_request:
  push:
    # version-15 is the stable line customers install from; version-15-hotfix is where its
    # backports collect until a release merges them into it. See CONTRIBUTING.md.
    branches: [version-15, version-15-hotfix]

concurrency:
  group: ci-${{ github.ref }}
  # Only auto-cancel PR runs. A cancelled run on a long-lived branch reads as neutral, not
  # failed, which hides regressions on the release line.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs the same .pre-commit-config.yaml the local hook runs, so the checks hold
  # even for a clone where nobody ran `pre-commit install`. Deliberately NOT in
  # the tests environment: this needs only python + node, and it should report in
  # under a minute rather than waiting on a bench.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pre-commit/action@v3.0.1
        env:
          # no-commit-to-branch is a LOCAL guard: it inspects the checked-out
          # branch name. On a `push` event the checkout IS the guarded branch,
          # so leaving it on would fail this job on every merge. It
          # has no meaning server-side anyway - the PR requirement is what
          # enforces it.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files --show-diff-on-failure

  # The frontend Vue SPA carries its own two test suites; this job is their gate. It needs
  # only node — no bench, no container — so it reports fast and independently of the
  # Python job below. The SPA is served identically on v15 and v16 sites, so this job is
  # identical to develop's.
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full-repo checkout, not a sparse frontend/ one: frontend/package.json depends on
      # ../wiki-graph-core via a `file:` link, so its sibling must be on disk for `npm ci`.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 is this repo's canonical dev/bench version and what the suite is validated
          # against locally. (The lint job runs 20 because it only shells pre-commit hooks.)
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Vitest (*.spec.js + tests/support-extraction/**/*.test.js)
        working-directory: frontend
        env:
          # Belt-and-braces: vitest already fails a non-watch run on an unhandled rejection, but
          # make node itself throw on one too so nothing rejects silently.
          NODE_OPTIONS: --unhandled-rejections=strict
        run: |
          # `npm test` is `vitest run` (non-watch). Exactly one file is quarantined:
          #
          #   tests/support-extraction/support-thread.test.js
          #
          # It has a single PRE-EXISTING, unrelated failure (a mid-flight ticket-switch reply is
          # asserted against a two-arg uploadTo() signature that has since grown extra args).
          # Excluding the one file lets the other files gate PRs today. DELETE this
          # --exclude — re-including the file — the moment that assertion is repaired upstream.
          npm test -- --exclude '**/support-thread.test.js'

      - name: node:test (co-located src/**/*.test.js)
        working-directory: frontend
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
        # node's runner exits non-zero on any failure or unhandled rejection; no watch mode exists
        # for `node --test`, so this is inherently a one-shot gate.
        run: npm run test:node

      - name: node:test (Desk widget + PWA lib)
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
        # These suites are plain node:test with only sibling-module imports (no npm deps),
        # so they run from the repo root with bare node - no `npm ci` needed. They were run by
        # NOTHING in CI before, which is exactly how a Desk-widget confirmation-card ordering
        # bug (a dropped field that renumbered a typed "confirm N" onto the wrong ERP write)
        # shipped under a green build. Gate them here.
        #
        # Each glob is `dir/*.test.mjs` - NOT recursive - so it covers only *.test.mjs files
        # sitting directly in that one directory, never a subdirectory's. jarvis/public/js/
        # has two: jarvis_onboarding_banner.test.mjs directly in it (the same gap as the
        # widget's, for the Desk nudge bundle - it `require()`s the bundle's CommonJS export
        # guard rather than a plain sibling import, see that file's own comment) and
        # pump_fence.test.mjs under shared/, which needs its own explicit pattern for exactly
        # this reason - it went ungated for a while after jarvis/public/js/*.test.mjs was
        # added, on the same silent-mismatch shape this whole job exists to close. A NEW
        # subdirectory under jarvis/public/js/ with its own *.test.mjs needs the same: add its
        # own line/pattern here, do not assume an existing glob already reaches it.
        run: |
          node --test jarvis/public/js/jarvis_chat/widget/*.test.mjs
          node --test jarvis/public/js/*.test.mjs jarvis/public/js/shared/*.test.mjs
          node --test pwa/src/lib/*.test.js

  # Builds BOTH deploy artifacts (the /jarvis SPA and the /jarvis-mobile PWA) on Node
  # 18.16.0 the way the Frappe Cloud v15 deploy does, so a Vite/workbox break surfaces here
  # instead of as a 404 (or a failed deploy) in production. The PWA reads the bench site
  # config via a bench-relative path a bare runner lacks; the SPA step stubs that file and
  # the PWA build reuses it. Node 18 is deliberate: FC v15 benches build on 18.16.0, so a
  # break that only shows up there must fail here, not at deploy time.
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Frappe Cloud v15 benches build the SPA on their default Node 18.16.0, so
          # build this deploy artifact on that exact version -- a Vite/dep break that
          # only shows up on Node 18 must fail here, not at FC deploy time.
          node-version: "18.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Stub the bench site config the SPA and PWA builds read (no bench in CI)
        # Both frontend/src/socket.js and pwa/src/socket.js import
        # ../../../../sites/common_site_config.json at build time (for the socketio port). A
        # bare runner has no bench, so stub it. The SPA's Vite resolves that import relative
        # to its root ($HOME/sites); the PWA resolves it relative to the file (two levels
        # above the checkout). Create it at both so each build finds it. FC builds inside a
        # real bench where this file already exists — this only reproduces that for CI.
        run: |
          stub='{"socketio_port": 9000, "developer_mode": 0}'
          for base in "$HOME" "$(cd pwa/src && cd ../../../../ && pwd)"; do
            mkdir -p "$base/sites"
            printf '%s' "$stub" > "$base/sites/common_site_config.json"
          done
      - name: Build the SPA (Vite) — the /jarvis deploy artifact
        run: npm run install-frontend && npm run build-frontend
      - name: Build the PWA (Vite) — the /jarvis-mobile deploy artifact
        # Gated here on Node 18.16.0 (previously skipped) so a PWA/workbox toolchain break
        # that only shows up on Node 18 fails in CI instead of at Frappe Cloud deploy time.
        # The stub above satisfies pwa/src/socket.js's bench-config import, same as the SPA.
        run: npm run install-pwa && npm run build-pwa

  # The v15 gate: from-scratch Frappe version-15 bench + the full jarvis suite.
  #
  # jarvis's tier-2 tools tests do mock.patch("erpnext...") and mock.patch("hrms..."), which
  # IMPORT those modules — so both erpnext AND hrms (version-15) must be installed, or those
  # tests error.
  tests:
    runs-on: ubuntu-latest
    # From-scratch v15 bench build + the full unsharded suite. Headroom over the
    # v16 PR job (which restores a baked image and shards 4 ways): as the v15 gap
    # closes, more tests RUN to completion instead of erroring fast at import, so
    # the suite got slower, not faster, and a 45 min cap cancelled a healthy run.
    timeout-minutes: 75

    strategy:
      # Never fail-fast: the default cancels surviving shards on the first failure, so you
      # see one broken shard instead of all of them (a cancelled leg also reports neutral,
      # hiding a real regression). Each shard rebuilds the bench from scratch — see the
      # header comment for why that x4 cost is acceptable on this public repo.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          # Passwordless mysql@localhost user so `healthcheck.sh --su-mysql --connect` works.
          MARIADB_MYSQL_LOCALHOST_USER: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20 --health-start-period=40s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Clone jarvis
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          # frappe version-15 pins requires-python ">=3.10,<3.15"; 3.11 is the version
          # v15 has run on in production the longest, so it is the least surprising pick.
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          # Pin the Frappe Cloud v15 bench default, Node 18.16.0, so CI runs on the
          # exact runtime the customer bench uses. This is only viable because the
          # root @google/gemini-cli dep (which demanded Node >= 20) is being dropped
          # for v15; keeping the bench on 18 rather than bumping FC to 20 is the
          # chosen strategy. frontend-tests stays on Node 24 -- that is a vitest/jsdom
          # tooling floor, unrelated to the FC runtime.
          node-version: "18.16.0"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          sudo npm install -g yarn
          pip install "frappe-bench>=5.29,<6"

      - name: Init bench (frappe version-15)
        run: |
          bench init --skip-redis-config-generation \
            --frappe-branch version-15 \
            --python "$(which python)" \
            frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          # Distinct Redis DB indices per role — Frappe assumes cache/queue/socketio do
          # not share a keyspace.
          bench set-config -g redis_cache "redis://127.0.0.1:6379/0"
          bench set-config -g redis_queue "redis://127.0.0.1:6379/1"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379/2"

      - name: Get apps (erpnext + hrms at version-15)
        working-directory: frappe-bench
        run: |
          # --skip-assets: backend tests never use the JS bundles; skip erpnext/hrms builds.
          # Serial on purpose: both get-apps write the shared venv and sites/apps.txt.
          bench get-app --branch version-15 --skip-assets erpnext
          bench get-app --branch version-15 --skip-assets hrms

      - name: Add jarvis to the bench
        working-directory: frappe-bench
        run: |
          # Deliberately NOT `bench get-app`: that runs `yarn install --check-files`
          # whenever an app has a package.json (bench/app.py), which here pulls
          # @google/gemini-cli and, via postinstall, both Vue frontends' deps — npm work
          # the Python suite never reads. Same reasoning as develop's ci.yml.
          cp -r "${GITHUB_WORKSPACE}/app" apps/jarvis
          ./env/bin/pip install -e apps/jarvis
          if ! grep -qxF jarvis sites/apps.txt; then
            # Guard against a no-trailing-newline apps.txt: a naive append would fuse the
            # last app name with "jarvis" and frappe dies on the merged module name.
            [ -z "$(tail -c1 sites/apps.txt)" ] || echo >> sites/apps.txt
            echo jarvis >> sites/apps.txt
          fi

      - name: Record what this run actually tested against
        working-directory: frappe-bench
        run: |
          # version-15 upstream moves under us; without this a green check is unauditable
          # after the fact. Read the SHAs from the clones that were actually installed —
          # an ls-remote taken earlier could drift from what a later clone fetched.
          {
            echo "### Upstream revisions (as cloned)"
            echo
            for app in frappe erpnext hrms; do
              echo "- ${app}: \`$(git -C "apps/${app}" rev-parse HEAD)\`"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Create test site + install apps
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --db-host 127.0.0.1 \
            --mariadb-user-host-login-scope='%' \
            --mariadb-root-password root \
            --db-root-username root \
            --admin-password admin
          bench --site test_site install-app erpnext hrms jarvis
          bench --site test_site set-config allow_tests true
          # Full suite creates far more than Frappe's default 60-users/60-min limit
          # (throttle_user_creation); raise it so no mid-suite fixture insert hits
          # "Throttled". -p stores an INT (a string limit breaks the count>limit compare).
          bench --site test_site set-config -p throttle_user_limit 100000

      - name: Assert the site is what we think it is
        working-directory: frappe-bench
        run: |
          # Fail fast with a clear "missing app" instead of letting a partial install
          # surface later as confusing tier-2 mock.patch("erpnext...") import errors.
          #
          # Take the JSON line specifically and leave stderr on the console: merging
          # stderr and taking `tail -1` would capture any late warning instead of the
          # JSON, failing a perfectly healthy site.
          apps=$(bench --site test_site execute frappe.get_installed_apps | grep -m1 '^\[') || {
            echo "could not parse installed apps from 'bench execute' output"; exit 1; }
          echo "installed apps: ${apps}"
          for a in frappe erpnext hrms jarvis; do
            echo "${apps}" | grep -q "\"${a}\"" || { echo "missing app: ${a}"; exit 1; }
          done

      - name: Run tests + coverage (shard ${{ matrix.shard }} of 4)
        working-directory: frappe-bench
        run: |
          # gevent: needed by jarvis/realtime/handlers.py (socketio_backend=python) and its
          # tests.
          ./env/bin/pip install coverage gevent
          # run-parallel-tests shards by test FILE across --total-builds, so each
          # --build-number runs a disjoint quarter of the suite. --with-coverage is this
          # command's spelling of run-tests' --coverage (different click commands; do not
          # "fix" one to match the other).
          bench --site test_site run-parallel-tests \
            --app jarvis \
            --build-number ${{ matrix.shard }} \
            --total-builds 4 \
            --with-coverage

      - name: Stash this shard's coverage under a non-hidden name
        working-directory: frappe-bench
        run: |
          # frappe's CodeCoverage writes sites/.coverage. Renaming off the leading dot is
          # deliberate: upload-artifact@v4 EXCLUDES hidden files, so uploading `.coverage`
          # silently produces an empty artifact and the combine job then fails on "No data
          # to report" long after the real cause scrolled past.
          mv sites/.coverage "sites/coverage-data-${{ matrix.shard }}"

      - name: Upload this shard's coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: frappe-bench/sites/coverage-data-${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: error

  # The coverage floor cannot be enforced inside a shard: each one exercises roughly a
  # quarter of the code, so all four would "fail" the gate. Combine the four data files,
  # then gate once. `needs: tests` against a matrix runs this only when EVERY leg
  # succeeded, so a failing shard surfaces as one honest test failure, not that plus a
  # bogus coverage failure from the missing quarter.
  coverage:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The test job pip install -e'd jarvis from $GITHUB_WORKSPACE/frappe-bench/apps/
          # jarvis, so the coverage data files reference that absolute source path. Place
          # the checkout there so `coverage report` can read the sources it has to count.
          path: frappe-bench/apps/jarvis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage
        # Pin to frappe's own constraint (apps/frappe/pyproject.toml: "coverage~=7.10.0"),
        # which is what wrote these data files. coverage's sqlite schema is stable across
        # 7.x, but a version that could not read them must fail loudly, not silently.
        run: pip install 'coverage~=7.10.0'

      - name: Download every shard's coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: covdata

      - name: Combine and enforce the floor
        working-directory: covdata
        run: |
          echo "shard data files:"; ls -l

          # Guard 1: every shard must have UPLOADED. Keep this count in step with the
          # matrix list in the tests job above (shard: [1, 2, 3, 4]).
          found=$(ls coverage-data-* 2>/dev/null | wc -l)
          [ "${found}" -eq 4 ] || { echo "expected 4 shard files, got ${found}"; exit 1; }

          # Guard 2: every shard must have been READ. `coverage combine` is not
          # all-or-nothing: per file it catches the error, warns, and carries on, raising
          # only when NOTHING combined. So one unreadable shard silently drops a quarter and
          # --fail-under then judges a partial dataset. Treat any warning as fatal.
          out=$(coverage combine coverage-data-* 2>&1); rc=$?
          echo "${out}"
          [ "${rc}" -eq 0 ] || exit "${rc}"
          if printf '%s' "${out}" | grep -qiE "warning|couldn't use"; then
            echo "::error::coverage combine could not read every shard; refusing to gate a partial dataset"
            exit 1
          fi

          # Enforced coverage floor. The v15 combined baseline measured 81% (lower than
          # v16's 87% because the v15 suite does not exercise the v16-only code paths:
          # compat.py's v16 branches, the orjson production serializer, etc.). Floor set one
          # point under the baseline for run-to-run variance. Ratchet UP over time; never down.
          coverage report --fail-under=80
