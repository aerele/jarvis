name: Runtime branding

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test generic scanner
        run: python -m unittest jarvis.tests.test_branding_scanner
      - name: Enforce Admin-owned policy on this commit
        env:
          # Immutable policy version: publish a new variable for each policy change.
          # No private repository credentials or policy contents ship in the app.
          JARVIS_BRANDING_POLICY: ${{ vars.JARVIS_BRANDING_POLICY_4210DBABA3520CD8 }}
        run: >-
          python -m jarvis.ci.runtime_branding
          --policy-env JARVIS_BRANDING_POLICY
          --expected-policy-sha256 4210dbaba3520cd8337aa3763090fc2449ca1870af3870a452c712d589d35774
